<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">诱骗态：换几档强度，多一组对照</title><desc id="desc">教学强度为零点五、零点一和真空。条形图展示发射端的真空、单光子、多光子成分，而非探测端计数。结合各档探测率和错误率对单光子贡献作保守估计。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<rect width="720" height="760" rx="16" fill="#fff" data-role="background"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="46" font-size="26" fill="#1e293b" text-anchor="start">诱骗态：换几档强度，多一组对照</text>
<text x="32" y="80" font-size="18" fill="#475569" text-anchor="start">发射端光子数分布；尚未扣除损耗与探测效率。</text>
<rect x="32" y="100" width="18" height="18" rx="3" fill="#cbd5e1" data-role="legend"/>
<text x="60" y="116" font-size="18" fill="#475569" text-anchor="start">0 个光子</text>
<rect x="246" y="100" width="18" height="18" rx="3" fill="#8b5cf6" data-role="legend"/>
<text x="274" y="116" font-size="18" fill="#475569" text-anchor="start">1 个光子</text>
<rect x="460" y="100" width="18" height="18" rx="3" fill="#f59e0b" data-role="legend"/>
<text x="488" y="116" font-size="18" fill="#475569" text-anchor="start">至少 2 个光子</text>
<text x="32" y="158" font-size="21" fill="#1e293b" text-anchor="start">信号态 · 主要用于产钥</text>
<rect x="32.0000" y="172" width="397.8841" height="32" fill="#cbd5e1" data-role="bar"/>
<rect x="429.8841" y="172" width="198.9421" height="32" fill="#8b5cf6" data-role="bar"/>
<rect x="628.8262" y="172" width="59.1738" height="32" fill="#f59e0b" data-role="bar"/>
<text x="32" y="231" font-size="18" fill="#475569" text-anchor="start">空的约六成；单光子约三成；多光子约一成</text>
<text x="32" y="276" font-size="21" fill="#1e293b" text-anchor="start">弱诱骗态 · 用来做对照</text>
<rect x="32.0000" y="290" width="593.5733" height="32" fill="#cbd5e1" data-role="bar"/>
<rect x="625.5733" y="290" width="59.3573" height="32" fill="#8b5cf6" data-role="bar"/>
<rect x="684.9307" y="290" width="3.0693" height="32" fill="#f59e0b" data-role="bar"/>
<text x="32" y="349" font-size="18" fill="#475569" text-anchor="start">更弱的一档：空的更多，单光子和多光子都更少</text>
<text x="32" y="394" font-size="21" fill="#1e293b" text-anchor="start">真空诱骗态 · 不发光</text>
<rect x="32.0000" y="408" width="656.0000" height="32" fill="#cbd5e1" data-role="bar"/>
<text x="32" y="467" font-size="18" fill="#475569" text-anchor="start">不发光时仍有计数，就能帮助估计背景噪声</text>
<path d="M360 490 V528" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="infer" x="32" y="528" width="656" height="130" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" data-role="box"/>
<text x="360" y="563" font-size="21" fill="#7c3aed" text-anchor="middle" data-container="infer">对比各档：收到多少，错了多少</text>
<text x="360" y="601" font-size="21" fill="#1e293b" text-anchor="middle" data-container="infer">估计单光子部分有多少可用</text>
<text x="360" y="638" font-size="19" fill="#475569" text-anchor="middle" data-container="infer">结合统计误差，决定最终能留下多少密钥</text>
<text x="32" y="706" font-size="18" fill="#475569" text-anchor="start">前提：光源符合模型，同光子数、同编码不暴露档位。</text>
<text x="32" y="736" font-size="18" fill="#475569" text-anchor="start">比例仅为教学示例；不逐个识别“安全光子”。</text>
</g></svg>
