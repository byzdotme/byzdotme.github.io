<svg xmlns="http://www.w3.org/2000/svg" width="640" height="494" viewBox="0 0 640 494" role="img" aria-labelledby="title desc">
<title id="title">流程里的决策交给谁</title><desc id="desc">三种可选控制方式，从预设步骤到阶段内自主判断，再到动态工具循环；没有强制升级顺序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="494" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">流程里的决策交给谁</text>
<rect x="40" y="94" width="560" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="130.48" font-size="22" text-anchor="middle" fill="#1e293b">固定 workflow</text>
<text x="320" y="162.48" font-size="22" text-anchor="middle" fill="#1e293b">步骤和分支由程序安排</text><rect x="40" y="206" width="560" height="90" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="242.48" font-size="22" text-anchor="middle" fill="#1e293b">固定阶段，阶段内由模型判断</text>
<text x="320" y="274.48" font-size="22" text-anchor="middle" fill="#1e293b">用阶段产物和检查条件约束执行</text><rect x="40" y="318" width="560" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="354.48" font-size="22" text-anchor="middle" fill="#1e293b">自主工具循环</text>
<text x="320" y="386.48" font-size="22" text-anchor="middle" fill="#1e293b">模型按反馈选择后续行动</text><text x="320" y="459" font-size="21" text-anchor="middle" fill="#1e293b">选择取决于任务的不确定性与检查能力</text>
</g></svg>
