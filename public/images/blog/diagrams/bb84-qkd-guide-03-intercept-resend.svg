<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc">
<title id="title">25% 错误率，是怎样算出来的？</title><desc id="desc">条件是 Alice 和 Bob 选了相同基，Eve 对全部信号等概率选基并截获重发。Eve 一半概率选对无错误，一半选错后 Bob 一半概率出错，总错误率为四分之一。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<rect width="720" height="610" rx="16" fill="#fff" data-role="background"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="46" font-size="26" fill="#1e293b" text-anchor="start">25% 错误率的计算过程</text>
<text x="32" y="80" font-size="18" fill="#475569" text-anchor="start">前提：理想无噪声；Eve 全量截获、随机选基、测量后重发。</text>
<rect id="retained" x="136" y="112" width="448" height="76" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" data-role="box"/>
<text x="360" y="143" font-size="21" fill="#7c3aed" text-anchor="middle" data-container="retained">只统计 Alice 与 Bob 同基的位置</text>
<text x="360" y="174" font-size="18" fill="#475569" text-anchor="middle" data-container="retained">其他位置已在筛选阶段丢弃</text>
<path d="M360 188 V214 H182 V246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M360 188 V214 H538 V246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="right" x="32" y="246" width="300" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" data-role="box"/>
<text x="182" y="280" font-size="21" fill="#1e293b" text-anchor="middle" data-container="right">Eve 猜对基 · 概率 1/2</text>
<text x="182" y="316" font-size="18" fill="#475569" text-anchor="middle" data-container="right">重发正确的基态</text>
<text x="182" y="347" font-size="20" fill="#1e293b" text-anchor="middle" data-container="right">Bob 出错概率：0</text>
<rect id="wrong" x="388" y="246" width="300" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" data-role="box"/>
<text x="538" y="280" font-size="21" fill="#1e293b" text-anchor="middle" data-container="wrong">Eve 猜错基 · 概率 1/2</text>
<text x="538" y="316" font-size="18" fill="#475569" text-anchor="middle" data-container="wrong">重发另一组基的基态</text>
<text x="538" y="347" font-size="20" fill="#1e293b" text-anchor="middle" data-container="wrong">Bob 出错概率：1/2</text>
<path d="M182 366 V408 H360 V444" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M538 366 V408 H360 V444" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="result" x="88" y="444" width="544" height="82" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" data-role="box"/>
<text x="360" y="479" font-size="22" fill="#1e293b" text-anchor="middle" data-container="result">预期 QBER = 1/2 × 0 + 1/2 × 1/2</text>
<text x="360" y="511" font-size="24" fill="#b45309" text-anchor="middle" data-container="result">= 25%</text>
</g></svg>
