<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1002" viewBox="0 0 640 1002" role="img" aria-labelledby="title desc">
<title id="title">TLS 1.2 · ECDHE 完整握手</title><desc id="desc">灰色消息在切换加密之前发送，被动监听者可见；紫色消息已受新密钥保护。左侧标注每条消息在回答哪个问题，右侧标注累计往返。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><marker id="arrowenc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="640" height="1002" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">TLS 1.2 · ECDHE 完整握手</text>
<rect x="36" y="82" width="72" height="48" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="72" y="113.8" font-size="20" text-anchor="middle" fill="#1e293b">客户端</text><rect x="306" y="82" width="72" height="48" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="342" y="113.8" font-size="20" text-anchor="middle" fill="#1e293b">服务器</text><text x="414" y="112" font-size="17" text-anchor="start" fill="#64748b">实线＝明文可见</text><text x="414" y="134" font-size="17" text-anchor="start" fill="#7c3aed">紫线＝已加密</text>
<path d="M72 148 V906" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/><path d="M342 148 V906" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
<text x="22" y="200" font-size="18" text-anchor="middle" fill="#94a3b8">谁</text>
<rect x="46" y="176" width="400" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="246" y="204" font-size="17" text-anchor="middle" fill="#1e293b">ClientHello · 支持的版本、套件、随机数 R₁</text>
<path d="M72 234 L342 234" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="252" width="400" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="246" y="280" font-size="17" text-anchor="middle" fill="#1e293b">ServerHello · 选定参数、随机数 R₂</text>
<path d="M342 310 L72 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="328" width="400" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="246" y="356" font-size="17" text-anchor="middle" fill="#1e293b">Certificate · 证书链，证明它是谁</text>
<path d="M342 386 L72 386" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="404" width="400" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="246" y="432" font-size="17" text-anchor="middle" fill="#1e293b">ServerKeyExchange · 临时公钥 ＋ 签名</text>
<path d="M342 462 L72 462" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="480" width="400" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="246" y="508" font-size="17" text-anchor="middle" fill="#1e293b">ServerHelloDone · 我这边说完了</text>
<path d="M342 538 L72 538" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="560" width="400" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="246" y="589" font-size="17" text-anchor="middle" fill="#1e293b">客户端验证证书链与签名</text>
<text x="22" y="648" font-size="18" text-anchor="middle" fill="#94a3b8">秘密</text>
<rect x="46" y="626" width="400" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="246" y="654" font-size="17" text-anchor="middle" fill="#1e293b">ClientKeyExchange · 客户端临时公钥</text>
<path d="M72 684 L342 684" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="706" width="548" height="50" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="736" font-size="17" text-anchor="middle" fill="#1e293b">双方算出同一个共享秘密，结合 R₁、R₂ 派生主秘密与双向密钥</text>
<text x="22" y="812" font-size="18" text-anchor="middle" fill="#94a3b8">一致</text>
<rect x="46" y="792" width="400" height="42" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="246" y="820" font-size="17" text-anchor="middle" fill="#1e293b">ChangeCipherSpec ＋ Finished</text>
<path d="M72 850 L342 850" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowenc)"/>
<rect x="46" y="868" width="400" height="42" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="246" y="896" font-size="17" text-anchor="middle" fill="#1e293b">ChangeCipherSpec ＋ Finished</text>
<path d="M342 926 L72 926" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowenc)"/>
<rect x="452" y="560" width="142" height="106" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="523" y="600" font-size="17" text-anchor="middle" fill="#64748b">握手共 2-RTT</text>
<text x="523" y="632" font-size="17" text-anchor="middle" fill="#64748b">客户端须先听完</text>
<text x="320" y="972" font-size="17" text-anchor="middle" fill="#64748b">省略会话恢复、客户端证书认证与 HelloRetryRequest</text>
</g></svg>
