<svg xmlns="http://www.w3.org/2000/svg" width="640" height="654" viewBox="0 0 640 654" role="img" aria-labelledby="title desc">
<title id="title">应用明文到网络密文</title><desc id="desc">客户端把HTTP字节交给TLS记录层加密认证，网络传输密文，服务器验证解密后交给HTTP服务；响应使用另一个方向的密钥。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="654" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">应用明文到网络密文</text>
<rect x="96" y="90" width="448" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="133.16" font-size="24" text-anchor="middle" fill="#1e293b">客户端：HTTP 请求字节</text><path d="M320 160 L320 186" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="190" width="448" height="84" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="223.48" font-size="22" text-anchor="middle" fill="#1e293b">TLS Record Layer</text>
<text x="320" y="255.48" font-size="22" text-anchor="middle" fill="#1e293b">分段、加密并生成认证标签</text><path d="M320 274 L320 300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="304" width="448" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="347.16" font-size="24" text-anchor="middle" fill="#1e293b">网络：受保护的 TLS record</text><path d="M320 374 L320 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="404" width="448" height="84" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="437.48" font-size="22" text-anchor="middle" fill="#1e293b">服务器 TLS 层</text>
<text x="320" y="469.48" font-size="22" text-anchor="middle" fill="#1e293b">验证认证标签并解密</text><path d="M320 488 L320 514" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="518" width="448" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="561.16" font-size="24" text-anchor="middle" fill="#1e293b">服务器：HTTP 服务读取明文</text><text x="320" y="632" font-size="21" text-anchor="middle" fill="#1e293b">响应使用服务器发送方向的密钥</text>
</g></svg>
