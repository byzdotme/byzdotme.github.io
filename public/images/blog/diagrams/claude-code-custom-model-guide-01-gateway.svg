<svg xmlns="http://www.w3.org/2000/svg" width="640" height="756" viewBox="0 0 640 756" role="img" aria-labelledby="title desc">
<title id="title">网关与协议适配的位置</title><desc id="desc">Claude Code CLI发送模型请求。网络代理只改变连接路径。支持的兼容网关可以路由到Claude；社区协议适配后连接其他模型不属于Anthropic官方支持路线。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="756" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">网关与协议适配的位置</text>
<rect x="160" y="92" width="320" height="74" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="137.16" font-size="24" text-anchor="middle" fill="#1e293b">Claude Code CLI</text><path d="M320 166 L320 208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="212" width="560" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="241.48" font-size="22" text-anchor="middle" fill="#1e293b">API 请求</text>
<text x="320" y="273.48" font-size="22" text-anchor="middle" fill="#1e293b">网络代理只影响连接路径</text><path d="M320 288 L320 320 L174 320 L174 358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 320 L466 320 L466 358" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="40" y="362" width="268" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="174" y="408.48" font-size="22" text-anchor="middle" fill="#1e293b">兼容 API 网关</text>
<text x="174" y="440.48" font-size="22" text-anchor="middle" fill="#1e293b">统一鉴权与路由</text><rect x="332" y="362" width="268" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="466" y="408.48" font-size="22" text-anchor="middle" fill="#1e293b">社区协议适配</text>
<text x="466" y="440.48" font-size="22" text-anchor="middle" fill="#1e293b">转换工具与流式协议</text><path d="M174 472 L174 520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M466 472 L466 520" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="40" y="524" width="268" height="90" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="174" y="576.48" font-size="22" text-anchor="middle" fill="#1e293b">Claude 模型</text><rect x="332" y="524" width="268" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="466" y="576.48" font-size="22" text-anchor="middle" fill="#1e293b">其他模型</text><text x="174" y="660" font-size="22" text-anchor="middle" fill="#0e7490">按支持文档配置</text><text x="466" y="660" font-size="22" text-anchor="middle" fill="#9f1239">非官方支持路线</text><text x="320" y="716" font-size="22" text-anchor="middle" fill="#1e293b">接通文本请求，不等于 Agent 交互兼容</text>
</g></svg>
