<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-labelledby="title desc">
<title id="title">热点账户：付款方分散，汇总侧排同一行</title><desc id="desc">三笔扣款各改各的账户行，互不排队；三笔加钱都要更新同一个商户余额行，只能依次等行级排他锁。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="880" height="660" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1e293b">
<text x="40" y="54" font-size="28">热点账户：付款方分散，汇总侧排同一行</text>
<text x="40" y="88" font-size="17" fill="#475569">同一笔支付，两端的并发压力完全不同</text>
<text x="50" y="150" font-size="19" fill="#334155">付款方：各改各的账户行</text>
<rect x="50" y="170" width="240" height="76" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="170" y="200" font-size="20" text-anchor="middle">买家 A 的账户行</text>
<text x="170" y="228" font-size="17" text-anchor="middle" fill="#475569">扣 100：只锁自己这一行</text>
<rect x="320" y="170" width="240" height="76" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="440" y="200" font-size="20" text-anchor="middle">买家 B 的账户行</text>
<text x="440" y="228" font-size="17" text-anchor="middle" fill="#475569">扣 100：只锁自己这一行</text>
<rect x="590" y="170" width="240" height="76" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="710" y="200" font-size="20" text-anchor="middle">买家 C 的账户行</text>
<text x="710" y="228" font-size="17" text-anchor="middle" fill="#475569">扣 100：只锁自己这一行</text>
<text x="50" y="286" font-size="17" fill="#166534">三笔扣款落在三行上，彼此不排队</text>
<line x1="440" y1="300" x2="440" y2="352" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470" y="332" font-size="17" fill="#475569">每笔加钱都要落到同一个商户账户上</text>
<rect x="180" y="368" width="520" height="212" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="440" y="402" font-size="20" text-anchor="middle" fill="#991b1b">商户余额行：只有一行，一把行锁</text>
<rect x="200" y="418" width="480" height="44" rx="8" fill="#fee2e2"/>
<text x="220" y="446" font-size="18" fill="#7f1d1d">1. UPDATE +95：已拿到锁，正在执行</text>
<rect x="200" y="470" width="480" height="44" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
<text x="220" y="498" font-size="18" fill="#7f1d1d">2. UPDATE +95：等锁</text>
<rect x="200" y="522" width="480" height="44" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
<text x="220" y="550" font-size="18" fill="#7f1d1d">3. UPDATE +95：等锁（后面还有）</text>
<text x="40" y="614" font-size="17" fill="#334155">排队的原因：行级排他锁要等到事务提交才释放，队首的事务有多长，后面就等多久。</text>
<text x="40" y="642" font-size="17" fill="#334155">事务里多塞一次远程调用，队首就多占一次网络往返。</text>
</g></svg>
