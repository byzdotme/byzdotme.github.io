<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
<title id="title">通道路由的两个阶段</title><desc id="desc">第一阶段按硬约束剔除通道，五种候选去掉四种；第二阶段在剩余候选之间比较费用、成功率和耗时，选定一条并记录决策依据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="860" height="560" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="26" text-anchor="start" fill="#1e293b">通道路由的两个阶段</text>
<text x="32" y="74" font-size="18" text-anchor="start" fill="#64748b">一次决策里，先砍掉不能用的，再比较能用的</text>

<text x="40" y="108" font-size="20" text-anchor="start" fill="#6d28d9">候选通道 · 按产品与签约关系取出</text>
<rect x="40" y="120" width="240" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="160" y="148" font-size="20" text-anchor="middle" fill="#1e293b">通道 A</text><text x="160" y="172" font-size="18" text-anchor="middle" fill="#64748b">能做本产品</text>
<rect x="310" y="120" width="240" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="430" y="148" font-size="20" text-anchor="middle" fill="#1e293b">通道 B</text><text x="430" y="172" font-size="18" text-anchor="middle" fill="#64748b">单笔限额不足</text>
<rect x="580" y="120" width="240" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="700" y="148" font-size="20" text-anchor="middle" fill="#1e293b">通道 C</text><text x="700" y="172" font-size="18" text-anchor="middle" fill="#64748b">不支持该卡种</text>
<rect x="40" y="196" width="240" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="160" y="224" font-size="20" text-anchor="middle" fill="#1e293b">通道 D</text><text x="160" y="248" font-size="18" text-anchor="middle" fill="#64748b">地区不可用</text>
<rect x="310" y="196" width="240" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="430" y="224" font-size="20" text-anchor="middle" fill="#1e293b">通道 E</text><text x="430" y="248" font-size="18" text-anchor="middle" fill="#64748b">维护或熔断中</text>

<path d="M430 262 L430 284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="288" width="780" height="98" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
<text x="60" y="316" font-size="20" text-anchor="start" fill="#9f1239">第一阶段 · 硬约束过滤：只判断能用不能用，不打分</text>
<text x="60" y="344" font-size="18" text-anchor="start" fill="#1e293b">看产品与签约关系是否覆盖</text><text x="330" y="344" font-size="18" text-anchor="start" fill="#1e293b">看地区与卡种是否支持</text><text x="580" y="344" font-size="18" text-anchor="start" fill="#1e293b">看限额与币种是否满足</text>
<text x="60" y="370" font-size="18" text-anchor="start" fill="#1e293b">看维护与熔断状态</text><text x="330" y="370" font-size="18" text-anchor="start" fill="#1e293b">本阶段不出分数</text><text x="580" y="370" font-size="18" text-anchor="start" fill="#1e293b">营销指定通道也要过这一关</text>
<path d="M430 386 L430 408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<text x="40" y="434" font-size="20" text-anchor="start" fill="#0e7490">第二阶段 · 在剩下的候选之间比较</text>
<rect x="40" y="446" width="240" height="52" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/><text x="160" y="470" font-size="20" text-anchor="middle" fill="#1e293b">通道 A</text><text x="160" y="490" font-size="17" text-anchor="middle" fill="#0e7490">参与评分</text>
<rect x="310" y="446" width="240" height="52" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/><text x="430" y="470" font-size="20" text-anchor="middle" fill="#1e293b">通道 C</text><text x="430" y="490" font-size="17" text-anchor="middle" fill="#0e7490">参与评分</text>
<text x="580" y="470" font-size="18" text-anchor="start" fill="#1e293b">比较的是</text>
<text x="580" y="494" font-size="18" text-anchor="start" fill="#1e293b">费用 · 成功率 · 耗时</text>

<text x="430" y="532" font-size="18" text-anchor="middle" fill="#1e293b">留下来的是谁、为什么排除，要随这笔请求一起记录</text>
</g></svg>
