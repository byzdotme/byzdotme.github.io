<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img" aria-labelledby="title desc">
<title id="title">执行、验证与有条件的重试</title><desc id="desc">执行产物经过可执行检查和需求审查，失败带证据重试；无进展、超预算或超授权则停止。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="590" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">执行、验证与有条件的重试</text>
<rect x="140" y="90" width="360" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="133.16" font-size="24" text-anchor="middle" fill="#1e293b">执行当前任务</text><path d="M320 160 L320 188" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="140" y="192" width="360" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="235.16" font-size="24" text-anchor="middle" fill="#1e293b">编译、测试、行为检查</text><path d="M320 262 L320 290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="140" y="294" width="360" height="70" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="336.48" font-size="22" text-anchor="middle" fill="#1e293b">审查需求覆盖与实际差异</text><path d="M320 364 L320 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="390" font-size="20" text-anchor="start" fill="#1e293b">通过</text><rect x="140" y="404" width="360" height="70" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="446.48" font-size="22" text-anchor="middle" fill="#1e293b">交付产物与验证证据</text><path d="M140 326 L44 326 L44 124 L136 124" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="233" font-size="20" text-anchor="start" fill="#1e293b">失败</text><text x="320" y="527" font-size="21" text-anchor="middle" fill="#1e293b">重试携带具体错误；没有进展则停止</text><text x="320" y="560" font-size="20" text-anchor="middle" fill="#1e293b">时间、费用和权限共同约束执行</text>
</g></svg>
