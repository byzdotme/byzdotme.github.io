<svg xmlns="http://www.w3.org/2000/svg" width="640" height="918" viewBox="0 0 640 918" role="img" aria-labelledby="title desc">
<title id="title">TLS 1.3 · 常规完整握手</title><desc id="desc">与 TLS 1.2 使用同一套画法。客户端在第一条消息里就给出临时公钥，服务器回复后双方立刻派生握手密钥，此后的认证消息全部加密。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><marker id="arrowenc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="640" height="918" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">TLS 1.3 · 常规完整握手</text>
<rect x="36" y="82" width="72" height="48" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="72" y="113.8" font-size="20" text-anchor="middle" fill="#1e293b">客户端</text><rect x="306" y="82" width="72" height="48" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="342" y="113.8" font-size="20" text-anchor="middle" fill="#1e293b">服务器</text><text x="414" y="112" font-size="17" text-anchor="start" fill="#64748b">实线＝明文可见</text><text x="414" y="134" font-size="17" text-anchor="start" fill="#7c3aed">紫线＝已加密</text>
<path d="M72 148 V824" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/><path d="M342 148 V824" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
<text x="22" y="200" font-size="18" text-anchor="middle" fill="#94a3b8">谁</text>
<rect x="46" y="176" width="360" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="226" y="204" font-size="17" text-anchor="middle" fill="#1e293b">ClientHello · 顺带带上临时公钥</text>
<path d="M72 234 L342 234" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="252" width="360" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="226" y="280" font-size="17" text-anchor="middle" fill="#1e293b">ServerHello · 选定参数 ＋ 它的临时公钥</text>
<path d="M342 310 L72 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="330" width="548" height="50" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="360" font-size="17" text-anchor="middle" fill="#1e293b">双方立刻算出共享秘密并派生握手密钥</text>
<rect x="46" y="404" width="360" height="42" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="226" y="432" font-size="17" text-anchor="middle" fill="#1e293b">EncryptedExtensions · 其余协商结果</text>
<path d="M342 462 L72 462" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowenc)"/>
<rect x="46" y="480" width="360" height="42" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="226" y="508" font-size="17" text-anchor="middle" fill="#1e293b">Certificate · 服务器证书链</text>
<path d="M342 538 L72 538" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowenc)"/>
<rect x="46" y="556" width="360" height="42" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="226" y="584" font-size="17" text-anchor="middle" fill="#1e293b">CertificateVerify · 对握手记录签名</text>
<path d="M342 614 L72 614" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowenc)"/>
<rect x="46" y="632" width="360" height="42" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="226" y="660" font-size="17" text-anchor="middle" fill="#1e293b">Finished · 确认密钥对得上</text>
<path d="M342 690 L72 690" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowenc)"/>
<text x="22" y="757" font-size="18" text-anchor="middle" fill="#94a3b8">一致</text>
<rect x="46" y="736" width="360" height="42" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="226" y="764" font-size="17" text-anchor="middle" fill="#1e293b">Finished · 客户端这边也确认</text>
<path d="M72 794 L342 794" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowenc)"/>
<rect x="444" y="404" width="150" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="519" y="440" font-size="17" text-anchor="middle" fill="#64748b">1-RTT 走完</text>
<text x="519" y="468" font-size="17" text-anchor="middle" fill="#64748b">证书已加密</text>
<text x="519" y="496" font-size="17" text-anchor="middle" fill="#64748b">服务器可先发数据</text>
<text x="320" y="866" font-size="17" text-anchor="middle" fill="#64748b">省略 HelloRetryRequest、PSK 会话恢复与 0-RTT</text>
<text x="320" y="894" font-size="17" text-anchor="middle" fill="#7c3aed">对比 1.2：临时公钥提前给出，省下一整个往返</text>
</g></svg>
