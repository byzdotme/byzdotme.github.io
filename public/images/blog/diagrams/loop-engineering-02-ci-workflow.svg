<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
<title id="title">一个 CI 修复循环的设计示例</title><desc id="desc">定时检查失败，按提交和问题去重，在隔离环境修复与验证，交付待审查改动，无法继续的任务交给人。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="650" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">一个 CI 修复循环的设计示例</text>
<rect x="96" y="86" width="448" height="66" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="127.16" font-size="24" text-anchor="middle" fill="#1e293b">定时读取 CI 失败与代码版本</text><path d="M320 152 L320 176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="180" width="448" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="211.48" font-size="22" text-anchor="middle" fill="#1e293b">检查已有任务与产物</text>
<text x="320" y="243.48" font-size="22" text-anchor="middle" fill="#1e293b">去重，确定值得处理的问题</text><path d="M320 260 L320 284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="288" width="448" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="319.48" font-size="22" text-anchor="middle" fill="#1e293b">隔离环境中复现与修复</text>
<text x="320" y="351.48" font-size="22" text-anchor="middle" fill="#1e293b">记录尝试和产物位置</text><path d="M320 368 L320 392" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="396" width="448" height="66" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="437.16" font-size="24" text-anchor="middle" fill="#1e293b">验证修复及相关行为</text><path d="M225 462 L166 498" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M415 462 L474 498" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="486" font-size="20" text-anchor="middle" fill="#1e293b">通过</text><text x="475" y="486" font-size="20" text-anchor="middle" fill="#1e293b">无法继续</text><rect x="36" y="504" width="260" height="88" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="166" y="555.48" font-size="22" text-anchor="middle" fill="#1e293b">交付待审查改动</text><rect x="344" y="504" width="260" height="88" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="474" y="539.48" font-size="22" text-anchor="middle" fill="#1e293b">保留问题与证据</text>
<text x="474" y="571.48" font-size="22" text-anchor="middle" fill="#1e293b">交给人处理</text><text x="320" y="630" font-size="20" text-anchor="middle" fill="#1e293b">下次先核对真实状态，再决定是否重做</text>
</g></svg>
