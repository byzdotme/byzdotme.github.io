<svg xmlns="http://www.w3.org/2000/svg" width="640" height="494" viewBox="0 0 640 494" role="img" aria-labelledby="title desc">
<title id="title">HTTPS 的两种协议栈</title><desc id="desc">HTTP1.1或HTTP2使用TLS over TCP；HTTP3使用集成TLS1.3握手的QUIC over UDP。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="494" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">HTTPS 的两种协议栈</text>
<rect x="36" y="92" width="270" height="72" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="171" y="135.48" font-size="22" text-anchor="middle" fill="#1e293b">HTTP/1.1 · HTTP/2</text><rect x="334" y="92" width="270" height="72" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="469" y="136.16" font-size="24" text-anchor="middle" fill="#1e293b">HTTP/3</text><path d="M171 164 L171 196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M469 164 L469 196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="200" width="270" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="171" y="246.8" font-size="20" text-anchor="middle" fill="#1e293b">TLS</text>
<text x="171" y="276.8" font-size="20" text-anchor="middle" fill="#1e293b">记录层保护应用数据</text><rect x="334" y="200" width="270" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="469" y="231.8" font-size="20" text-anchor="middle" fill="#1e293b">QUIC</text>
<text x="469" y="261.8" font-size="20" text-anchor="middle" fill="#1e293b">集成 TLS 1.3 握手</text>
<text x="469" y="291.8" font-size="20" text-anchor="middle" fill="#1e293b">QUIC 包保护</text><path d="M171 310 L171 342" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M469 310 L469 342" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="346" width="270" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="171" y="388.16" font-size="24" text-anchor="middle" fill="#1e293b">TCP</text><rect x="334" y="346" width="270" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="469" y="388.16" font-size="24" text-anchor="middle" fill="#1e293b">UDP</text><text x="320" y="462" font-size="20" text-anchor="middle" fill="#1e293b">图中省略两侧共同的 IP 层</text>
</g></svg>
