<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">同一段规则，两种切法</title><desc id="desc">固定长度切分把约束条件切到相邻块，问能不能重试只会召回前一块；按小节切分时规则与前提留在同一个块里。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="580" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">同一段规则，两种切法</text>
<rect x="40" y="70" width="560" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="320" y="102" font-size="22" text-anchor="middle" fill="#1e293b">原文小节「超时与重试」</text>
<text x="320" y="134" font-size="20" text-anchor="middle" fill="#1e293b">该接口支持重试。</text>
<text x="320" y="164" font-size="20" text-anchor="middle" fill="#1e293b">但必须沿用首次请求的幂等键。</text>
<path d="M320 182 L320 198 L170 198 L170 214" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M320 182 L320 198 L470 198 L470 214" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="238" font-size="20" text-anchor="middle" fill="#1e293b">按固定长度切</text>
<text x="170" y="262" font-size="18" text-anchor="middle" fill="#6d28d9">每 N 个字符一刀</text>
<text x="470" y="238" font-size="20" text-anchor="middle" fill="#1e293b">按小节边界切</text>
<text x="470" y="262" font-size="18" text-anchor="middle" fill="#0e7490">按标题与段落断</text>
<rect x="48" y="280" width="244" height="80" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="170" y="318" font-size="20" text-anchor="middle" fill="#1e293b">该接口支持重试。</text>
<text x="170" y="346" font-size="18" text-anchor="middle" fill="#6d28d9">命中这一块</text>
<rect x="48" y="376" width="244" height="80" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="170" y="414" font-size="20" text-anchor="middle" fill="#1e293b">但必须沿用原幂等键。</text>
<text x="170" y="442" font-size="18" text-anchor="middle" fill="#b91c1c">约束落在块 2</text>
<rect x="348" y="280" width="244" height="176" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="470" y="318" font-size="20" text-anchor="middle" fill="#1e293b">该接口支持重试。</text>
<text x="470" y="352" font-size="20" text-anchor="middle" fill="#1e293b">但必须沿用</text>
<text x="470" y="382" font-size="20" text-anchor="middle" fill="#1e293b">首次请求的幂等键。</text>
<text x="470" y="418" font-size="18" text-anchor="middle" fill="#6d28d9">命中的句子和</text>
<text x="470" y="442" font-size="18" text-anchor="middle" fill="#6d28d9">它的前提在同一个块</text>
<text x="170" y="484" font-size="18" text-anchor="middle" fill="#1e293b">问「能不能重试」</text>
<text x="170" y="508" font-size="18" text-anchor="middle" fill="#1e293b">只召回块 1</text>
<text x="470" y="484" font-size="18" text-anchor="middle" fill="#1e293b">约束跟着规则一起回来</text>
<text x="320" y="548" font-size="20" text-anchor="middle" fill="#1e293b">切分边界决定前提条件跟不跟着规则走</text>
</g></svg>
