<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
<title id="title">RAG 的文档与查询链路</title><desc id="desc">左侧更新索引；右侧查询在权限范围内召回，再重排生成带出处的回答。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="660" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">RAG 的文档与查询链路</text>
<text x="170" y="100" font-size="24" text-anchor="middle" fill="#6d28d9">文档更新</text><text x="470" y="100" font-size="24" text-anchor="middle" fill="#0e7490">每次查询</text><rect x="50" y="126" width="240" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="170" y="171.16" font-size="24" text-anchor="middle" fill="#1e293b">解析与清洗</text><path d="M170 200 L170 226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="230" width="240" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="170" y="267.16" font-size="24" text-anchor="middle" fill="#1e293b">按结构切分</text>
<text x="170" y="301.16" font-size="24" text-anchor="middle" fill="#1e293b">保留来源与版本</text><path d="M170 322 L170 350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="354" width="240" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="170" y="391.8" font-size="20" text-anchor="middle" fill="#1e293b">向量 / 关键词索引</text>
<text x="170" y="421.8" font-size="20" text-anchor="middle" fill="#1e293b">同步删除与权限</text><rect x="350" y="126" width="240" height="74" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="470" y="171.16" font-size="24" text-anchor="middle" fill="#1e293b">问题与用户身份</text><path d="M470 200 L470 226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="230" width="240" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="470" y="267.8" font-size="20" text-anchor="middle" fill="#1e293b">权限范围内召回</text>
<text x="470" y="297.8" font-size="20" text-anchor="middle" fill="#1e293b">必要时改写查询</text><path d="M470 322 L470 350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="354" width="240" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="470" y="408.16" font-size="24" text-anchor="middle" fill="#1e293b">去重与重排</text><path d="M470 446 L470 474" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="478" width="240" height="92" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="470" y="515.16" font-size="24" text-anchor="middle" fill="#1e293b">生成回答</text>
<text x="470" y="549.16" font-size="24" text-anchor="middle" fill="#1e293b">保留原文出处</text><path d="M290 400 L322 400 L322 276 L346 276" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="625" font-size="22" text-anchor="middle" fill="#1e293b">召回、排序、生成分别留记录</text>
</g></svg>
