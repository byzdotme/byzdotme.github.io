<svg xmlns="http://www.w3.org/2000/svg" width="640" height="882" viewBox="0 0 640 882" role="img" aria-labelledby="title desc">
<title id="title">消息受理与后续处理</title><desc id="desc">发送入口完成身份与必要规则检查，消息和outbox在同一事务提交后返回受理。后台发布事件，通知搜索开放平台审计和AI各自处理并维护重试。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="882" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">消息受理与后续处理</text>
<rect x="40" y="92" width="560" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="128.48" font-size="22" text-anchor="middle" fill="#1e293b">发送请求</text>
<text x="320" y="160.48" font-size="22" text-anchor="middle" fill="#1e293b">可信身份 · 幂等键</text><path d="M320 182 L320 216" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="220" width="560" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="270.16" font-size="24" text-anchor="middle" fill="#1e293b">会话权限与必要治理检查</text><path d="M320 304 L320 344" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="348" width="560" height="100" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="389.48" font-size="22" text-anchor="middle" fill="#1e293b">同一事务：Message + Outbox</text>
<text x="320" y="421.48" font-size="22" text-anchor="middle" fill="#1e293b">提交成功即可返回受理结果</text><path d="M320 448 L320 486" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="140" y="490" width="360" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="539.48" font-size="22" text-anchor="middle" fill="#1e293b">后台发布 MessageSent</text><path d="M320 574 L320 620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="624" width="576" height="198" rx="12" fill="#faf8ff" stroke="#a78bfa" stroke-width="1.5"/><rect x="40" y="650" width="180" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="130" y="693.48" font-size="22" text-anchor="middle" fill="#1e293b">通知</text><rect x="230" y="650" width="180" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="693.48" font-size="22" text-anchor="middle" fill="#1e293b">搜索</text><rect x="420" y="650" width="180" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="510" y="693.48" font-size="22" text-anchor="middle" fill="#1e293b">开放平台</text><rect x="135" y="742" width="180" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="225" y="781.48" font-size="22" text-anchor="middle" fill="#1e293b">审计处理</text><rect x="325" y="742" width="180" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="415" y="781.48" font-size="22" text-anchor="middle" fill="#1e293b">AI 摘要</text><text x="320" y="850" font-size="22" text-anchor="middle" fill="#1e293b">各自记录进度、幂等、失败与重试</text>
</g></svg>
