<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
<title id="title">查不到时，循环怎样继续</title><desc id="desc">检索后评估证据。充分则回答，不足则在预算内补查；超限或没有新证据时结束。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="660" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">查不到时，循环怎样继续</text>
<rect x="160" y="90" width="320" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="130.16" font-size="24" text-anchor="middle" fill="#1e293b">问题与已有证据</text><path d="M320 154 L320 182" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="186" width="320" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="226.16" font-size="24" text-anchor="middle" fill="#1e293b">权限内检索</text><path d="M320 250 L320 278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="282" width="320" height="72" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="326.16" font-size="24" text-anchor="middle" fill="#1e293b">证据是否足够？</text><path d="M230 354 L170 402" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="172" y="386" font-size="20" text-anchor="middle" fill="#1e293b">足够</text><rect x="40" y="406" width="250" height="90" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="165" y="458.48" font-size="22" text-anchor="middle" fill="#1e293b">回答并引用原文</text><path d="M410 354 L470 402" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="386" font-size="20" text-anchor="middle" fill="#1e293b">不足</text><rect x="350" y="406" width="250" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="457.8" font-size="20" text-anchor="middle" fill="#1e293b">有预算且值得补查？</text><path d="M600 450 L618 450 L618 218 L484 218" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="192" font-size="20" text-anchor="middle" fill="#1e293b">是：补查</text><path d="M470 496 L470 534" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="526" font-size="20" text-anchor="start" fill="#1e293b">否</text><rect x="350" y="538" width="250" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="571.48" font-size="22" text-anchor="middle" fill="#1e293b">说明缺少依据</text>
<text x="475" y="603.48" font-size="22" text-anchor="middle" fill="#1e293b">停止检索</text>
</g></svg>
