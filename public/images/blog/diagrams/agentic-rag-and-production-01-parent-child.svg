<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
<title id="title">匹配小块，返回完整小节</title><desc id="desc">查询命中子块后，通过parent_id返回同版本且已授权的父块，包含规则与前提。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<rect width="640" height="510" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="28" text-anchor="start" fill="#1e293b">匹配小块，返回完整小节</text>
<rect x="72" y="88" width="496" height="72" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="132.16" font-size="24" text-anchor="middle" fill="#1e293b">查询：退款超时后能否重试？</text><path d="M320 160 L320 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="194" width="496" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="244.16" font-size="24" text-anchor="middle" fill="#1e293b">命中子块：该接口支持重试</text><path d="M320 278 L320 334" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="334" y="314" font-size="20" text-anchor="start" fill="#6d28d9">parent_id</text><rect x="72" y="338" width="496" height="108" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/><text x="320" y="383.48" font-size="22" text-anchor="middle" fill="#1e293b">返回父小节</text>
<text x="320" y="415.48" font-size="22" text-anchor="middle" fill="#1e293b">支持重试，但必须沿用原幂等键</text><text x="320" y="485" font-size="20" text-anchor="middle" fill="#1e293b">回补前检查权限、版本，并去重</text>
</g></svg>
