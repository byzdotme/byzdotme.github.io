<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">BB84：哪些信息公开，哪些留在本地？</title><desc id="desc">量子信道发送四种候选态。经典信道公开基、测试样本、纠错信息和散列种子，所有这些交互必须认证。最终密钥留在两端本地，安全条件不足时中止。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<rect width="720" height="1080" rx="16" fill="#fff" data-role="background"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="80" font-size="18" fill="#475569" text-anchor="start">紫色：量子发送    灰色：认证的公开交互    绿色：本地秘密</text>
<rect id="alice" x="32" y="106" width="300" height="52" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" data-role="box"/>
<text x="182" y="139" font-size="21" fill="#7c3aed" text-anchor="middle" data-container="alice">Alice · 发送端</text>
<rect id="bob" x="388" y="106" width="300" height="52" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" data-role="box"/>
<text x="538" y="139" font-size="21" fill="#7c3aed" text-anchor="middle" data-container="bob">Bob · 接收端</text>
<rect id="send" x="32" y="186" width="656" height="108" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" data-role="box"/>
<text x="52" y="218" font-size="21" fill="#7c3aed" text-anchor="start" data-container="send">1. 量子发送：制备量子态 → 随机选基测量</text>
<text x="52" y="251" font-size="18" fill="#475569" text-anchor="start" data-container="send">Alice 随机选比特和基；Bob 独立随机选基。</text>
<text x="52" y="278" font-size="18" fill="#475569" text-anchor="start" data-container="send">两端各自记录，量子信号可以被 Eve 截获。</text>
<path d="M360 294 V330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="sift" x="32" y="330" width="656" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" data-role="box"/>
<text x="52" y="362" font-size="21" fill="#1e293b" text-anchor="start" data-container="sift">2. 对基：公开探测位置与基选择</text>
<text x="52" y="395" font-size="18" fill="#475569" text-anchor="start" data-container="sift">保留有效探测中基相同的位置。</text>
<text x="52" y="422" font-size="18" fill="#475569" text-anchor="start" data-container="sift">未公布的比特值仍由双方各自保存。</text>
<path d="M360 438 V474" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="test" x="32" y="474" width="656" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" data-role="box"/>
<text x="52" y="506" font-size="21" fill="#1e293b" text-anchor="start" data-container="test">3. 抽样：公开部分比特，估计安全参数</text>
<text x="52" y="539" font-size="18" fill="#475569" text-anchor="start" data-container="test">测试位已公开，不能再作为秘密保留。</text>
<text x="52" y="566" font-size="18" fill="#475569" text-anchor="start" data-container="test">样本量与统计偏差会影响可提取的密钥长度。</text>
<path d="M360 582 V618" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="correct" x="32" y="618" width="656" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" data-role="box"/>
<text x="52" y="650" font-size="21" fill="#1e293b" text-anchor="start" data-container="correct">4. 信息协调：交换校验信息并确认一致</text>
<text x="52" y="683" font-size="18" fill="#475569" text-anchor="start" data-container="correct">让两边候选比特串对齐。</text>
<text x="52" y="710" font-size="18" fill="#475569" text-anchor="start" data-container="correct">公开泄露的信息要计入后续安全分析。</text>
<path d="M360 726 V762" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="privacy" x="32" y="762" width="656" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" data-role="box"/>
<text x="52" y="794" font-size="21" fill="#1e293b" text-anchor="start" data-container="privacy">5. 隐私放大：公开散列选择，本地压缩</text>
<text x="52" y="827" font-size="18" fill="#475569" text-anchor="start" data-container="privacy">根据安全估计确定输出长度。</text>
<text x="52" y="854" font-size="18" fill="#475569" text-anchor="start" data-container="privacy">把候选数据变成更短的最终秘密密钥。</text>
<path d="M360 870 V896 H182 V920" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M360 870 V896 H538 V920" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="key-a" x="32" y="920" width="300" height="80" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" data-role="box"/>
<text x="182" y="952" font-size="23" fill="#047857" text-anchor="middle" data-container="key-a">Alice 持有 K</text>
<text x="182" y="982" font-size="18" fill="#475569" text-anchor="middle" data-container="key-a">经典比特串 · 不在此公开</text>
<rect id="key-b" x="388" y="920" width="300" height="80" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" data-role="box"/>
<text x="538" y="952" font-size="23" fill="#047857" text-anchor="middle" data-container="key-b">Bob 持有 K</text>
<text x="538" y="982" font-size="18" fill="#475569" text-anchor="middle" data-container="key-b">经典比特串 · 不在此公开</text>
<text x="32" y="1045" font-size="19" fill="#b45309" text-anchor="start">任一步安全条件不足：中止，不交付这一批新密钥。</text>
</g></svg>
