name: deploy-byz.me

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 
      - name: setup pnpm
        uses: pnpm/action-setup@v5
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: setup pages
        uses: actions/configure-pages@v6
      - name: clean install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm run build
      - name: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: deploy
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5